name = "gitpass-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Free tier: Workers (100k req/day), D1 (5GB, 5M reads + 100k writes/day).
# No KV, no Durable Objects, no paid add-on — see docs/DEPLOYMENT.md.

[[d1_databases]]
binding = "DB"
database_name = "gitpass"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Overridden per environment with `wrangler secret put JWT_SECRET`.
ENVIRONMENT = "development"
